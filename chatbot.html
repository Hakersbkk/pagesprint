<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amal — AI assistant demo (Pizza Amal)</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f4f3ef;color:#16202b;display:flex;justify-content:center;padding:24px 12px}
.phone{width:100%;max-width:430px;background:#fff;border:1px solid #e2dfd6;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;height:min(82vh,640px)}
.bar{background:#16202b;color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:#e2552b;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.bar b{display:block}.bar small{opacity:.7}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#faf9f6}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap}
.bot{background:#fff;border:1px solid #e6e2d9;align-self:flex-start;border-bottom-left-radius:4px}
.me{background:#e2552b;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #e6e2d9}
input{flex:1;font:inherit;padding:11px 14px;border:1px solid #cfcbc0;border-radius:20px}
button{font:inherit;font-weight:700;padding:11px 18px;border:0;border-radius:20px;background:#16202b;color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.hint{padding:0 16px 10px;color:#667380;font-size:.8rem;text-align:center}
a{color:#e2552b}
</style>
</head>
<body>
<div class="phone">
  <div class="bar"><div class="avatar">🍕</div><div><b>Amal — Pizza Amal</b><small>AI assistant · online 24/7</small></div></div>
  <div class="chat" id="chat"></div>
  <div class="hint">Live demo — the AI answers in darija, Arabic, French or English. Try: «شحال الفرماجة؟» / «livraison à gueliz?» / "order 2 margherita"</div>
  <form id="f"><input id="i" placeholder="Write a message..." autocomplete="off" required><button>Send</button></form>
</div>
<script>
const chat = document.getElementById("chat"), f = document.getElementById("f"), i = document.getElementById("i");
const hist = [{"role":"user","content":"salam"},{"role":"assistant","content":"Salam ! Bienvenue chez Pizza Amal 🍕 Je suis Amal, votre assistante. Comment puis-je vous aider ?"}];
function add(role, text){ const d=document.createElement("div"); d.className="msg "+(role==="user"?"me":"bot"); d.textContent=text; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; }
hist.slice(1).forEach(m => add(m.role === "user" ? "user" : "bot", m.content));
f.addEventListener("submit", async e => {
  e.preventDefault();
  const t = i.value.trim(); if (!t) return;
  i.value = ""; add("user", t); hist.push({role:"user", content:t});
  const b = f.querySelector("button"); b.disabled = true;
  const wait = add("bot", "…");
  try {
    const r = await fetch("/api/chat", {method:"POST", body: JSON.stringify({messages: hist.slice(-12)})});
    const d = await r.json();
    wait.textContent = d.reply || ("Error: " + (d.error || "no reply"));
    if (d.reply) hist.push({role:"assistant", content:d.reply});
  } catch (err) { wait.textContent = "Error: " + err.message; }
  b.disabled = false; chat.scrollTop = chat.scrollHeight;
});
</script>
</body>
</html>
